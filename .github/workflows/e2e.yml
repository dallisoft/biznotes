# Playwright e2e — 수동 실행 전용. 실스택(make up)을 띄우고 시드 계정으로 돈다.
# LLM 프로바이더를 등록하지 않으므로 LLM 응답이 필요한 화면은 각 스펙의 모의 응답에 기댄다.
name: e2e

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "실행할 테스트 이름 정규식(비우면 전체)"
        required: false
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 스택 기동
        run: |
          make up
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:28000/readyz >/dev/null && curl -fsS http://localhost:23000/login >/dev/null && break
            sleep 5
          done
          curl -fsS http://localhost:28000/readyz
      - run: make seed
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: playwright
        working-directory: apps/web
        env:
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then pnpm exec playwright test --grep "$GREP"; else pnpm exec playwright test; fi
      - name: 실패 산출물
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
      - name: 스택 로그
        if: always()
        run: docker compose -f infra/compose.yml -f infra/compose.dev.yml logs --no-color --tail=300 api worker web
